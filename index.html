<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title> Product Form using array </title>
		<!--<title>
			Take product name, price, product description and image from input and push it into array and then fetch those product details in cards
		</title>-->
		<script src="https://cdn.tailwindcss.com"></script>
		
		<style>
			@import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");

			* {
				font-family: "Poppins", sans-serif;
			}
			
			
	.remove-card-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.9);
      color: #1e293b;
      font-size: 16px;
      font-weight: bold;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0, 0, 0, 0.1);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      transition: background-color 0.2s, transform 0.15s, color 0.2s;
      z-index: 10;
      padding: 0;
      outline: none;
      user-select: none;
    }
    .remove-card-btn:hover {
      background-color: #ef4444;
      color: white;
      transform: scale(1.1);
      border-color: #ef4444;
    }
    .remove-card-btn:active {
      transform: scale(0.95);
    }
		</style>
	</head>
	
	<body class="bg-slate-50 min-h-screen text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">
			
		<section class="relative flex flex-col justify-center items-center min-h-screen py-10 px-2 overflow-hidden">
			<!-- Subtle ambient glowing background blur -->
			<div class="absolute -top-10 left-1/2 -translate-x-1/2 w-[600px] h-[500px] bg-emerald-300/30 rounded-full blur-3xl pointer-events-none"></div>

			<div class="relative w-full max-w-lg bg-white/80 backdrop-blur-md border border-slate-200/80 rounded-2xl p-8 shadow-xl shadow-slate-200/50 transition-all">
				
				<!-- Subtle Top accent line -->
				<div class="absolute top-0 left-8 right-8 h-[3px] bg-gradient-to-r from-emerald-800 via-emerald-500 to-emerald-800 rounded-full"></div>

				<h2 class="text-2xl font-bold text-slate-900 mb-6">Product Information</h2>

				<form class="space-y-5">
					<div>
						<label class="flex items-center gap-2 text-slate-700 font-medium text-sm mb-2">
							<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Product Sequence
						</label>
						<input id="productSeq" type="number" placeholder="001" class="w-full bg-slate-50/80 border border-slate-200 rounded-xl px-4 py-3 text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 focus:bg-white -translate-y-0 focus:-translate-y-0.5 transition-all duration-200"/>
					</div>

					<div>
						<label class="flex items-center gap-2 text-slate-700 font-medium text-sm mb-2">
							<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Product Name
						</label>
						<input id="productName" type="text"  placeholder="Watches" class="w-full bg-slate-50/80 border border-slate-200 rounded-xl px-4 py-3 text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 focus:bg-white -translate-y-0 focus:-translate-y-0.5 transition-all duration-200"/>
					</div>

					<div>
						<label class="flex items-center gap-2 text-slate-700 font-medium text-sm mb-2">
							<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Product Description
						</label>
						<textarea id="productDescription" rows="4" placeholder="Write Product Details..."  class="w-full bg-slate-50/80 border border-slate-200 rounded-xl px-4 py-3 text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 focus:bg-white -translate-y-0 focus:-translate-y-0.5 transition-all duration-200 resize-none"></textarea>
					</div>
					
					<div>
						<label class="flex items-center gap-2 text-slate-700 font-medium text-sm mb-2">
							<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Product Price
						</label>
						<input id="productPrice" type="number" placeholder="₹Rupees" class="w-full bg-slate-50/80 border border-slate-200 rounded-xl px-4 py-3 text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 focus:bg-white -translate-y-0 focus:-translate-y-0.5 transition-all duration-200"/>

					</div>
					
					<div>
						<label class="flex items-center gap-2 text-slate-700 font-medium text-sm mb-2">
							<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Product Image URL
						</label>
						<input id="productImage" type="text" placeholder="https://example.com/image.jpg" class="w-full bg-slate-50/80 border border-slate-200 rounded-xl px-4 py-3 text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 focus:bg-white -translate-y-0 focus:-translate-y-0.5 transition-all duration-200"/>

					</div>
					
					<div class="pt-2">
						<button onclick="addproduct()" type="button" class="w-full bg-gradient-to-r from-emerald-800 to-emerald-600 hover:from-emerald-700 hover:to-emerald-500 text-white font-medium text-sm py-3.5 px-6 rounded-xl shadow-lg shadow-emerald-700/20 hover:shadow-xl hover:shadow-emerald-700/30 active:scale-[0.99] transition-all duration-200 cursor-pointer">
							Submit Product
						</button>
					</div>
				</form>
			</div>
			
			
			<div class="pt-2">
				<button onclick="pop()" type="button" class="w-full bg-gradient-to-r from-emerald-800 to-emerald-600 hover:from-emerald-700 hover:to-emerald-500 text-white font-medium text-sm py-3.5 px-6 rounded-xl shadow-lg shadow-emerald-700/20 hover:shadow-xl hover:shadow-emerald-700/30 active:scale-[0.99] transition-all duration-200 cursor-pointer">
					POP THE CARD
				</button>
			</div>
			
			<br>
			  <div class="flex flex-1 gap-2">
				<input id="AddedSequence" type="number" placeholder="Seq No To Add " class=" text-black rounded-xl px-1 text-slate-500 transition-all border border-black" />
				
				<button onclick="addedBySequence()" type="button" class=" border border-black text-black font-medium text-sm py-3 px-5 rounded-xl active:scale-[0.99] transition-all duration-200 ">
				  Addded by Seq
				</button>
			  </div>
			
			<div id="card-con" class="relative w-full max-w-5xl mt-10 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 justify-items-center">
			
			</div>
		</section>
		
		<script>
			
			var products = [];
			
			function addproduct(){
				var seq = document.getElementById('productSeq').value;
				var name = document.getElementById('productName').value;
				var desc = document.getElementById('productDescription').value;
				var image = document.getElementById('productImage').value;
				var price = document.getElementById('productPrice').value;

				products[products.length] = {
					seq: seq,
					name: name,
					desc: desc,
					image: image,
					price: price
				};
					
				document.getElementById('productSeq').value ='';
				document.getElementById('productName').value ='';
				document.getElementById('productDescription').value ='';
				document.getElementById('productImage').value ='';
				document.getElementById('productPrice').value ='';

				var container = document.getElementById('card-con');
				container.innerHTML ='';
				
				
				for(var i = 0 ; i < products.length ; i++){
					var p = products[i];
					
					container.innerHTML = container.innerHTML +`
					<div class="w-full max-w-sm bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden">
						
                        <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover bg-gray-100"/>
						 <button class="remove-card-btn" onclick="removeProduct(${i})" title="Remove this product" aria-label="Remove product">✕</button>

                        <div class="p-5 space-y-2">
                            <p class="text-xs font-semibold text-emerald-600 uppercase tracking-wide">Sequence: <span>${p.seq}</span></p>
                            <h3 class="text-lg font-bold text-gray-900"> Name : <span>${p.name} </span></h3>
                            <p class="text-sm text-gray-500 leading-relaxed"> Description: <span>${p.desc}</span></p>
							<p class="text-sm text-gray-500 leading-relaxed"> Price: <span> ${p.price}</span></p>
							
                        </div>
                    </div>
					`;
				}
				console.log(products);
			}
			
			function pop(){
				products.pop();
				
				var container = document.getElementById('card-con');
				container.innerHTML = '';
				
				for(var i = 0 ; i < products.length ; i++){
					var p = products[i];
					
					container.innerHTML = container.innerHTML +`
					
					<div class="w-full max-w-sm bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden">
                        <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover bg-gray-100"/>
                        <div class="p-5 space-y-2">
                            <p class="text-xs font-semibold text-emerald-600 uppercase tracking-wide">Sequence: <span>${p.seq}</span></p>
                            <h3 class="text-lg font-bold text-gray-900"> Name : <span>${p.name}</span></h3>
                            <p class="text-sm text-gray-500 leading-relaxed">Description: <span> ${p.desc} </span></p>
							<p class="text-sm text-gray-500 leading-relaxed">Price: <span> ${p.price} </span></p>
                        </div>
                    </div>
					`;
				}
				console.log(products);
			}
			
			function removeProduct(){
				
				Products.splice();
				console.log(products);
			}
		</script>
		
	</body>
</html>
